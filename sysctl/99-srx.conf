# srx's sysctl knobs for optimization, without needing cachyos-settings because that package caused
# my speakers to crack

# bbr/fq tweak already done so this conf file does not include it

# network
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_mtu_probe_floor = 1024
net.ipv4.ip_local_port_range = 30000 65535
net.core.netdev_max_backlog = 4096

# vm
vm.swappiness = 100
vm.vfs_cache_pressure = 25
vm.dirty_ratio = 10
vm.page-cluster = 0
vm.dirty_background_ratio = 3
vm.max_map_count = 16777216

# kernel
kernel.nmi_watchdog = 0
kernel.printk = 3 3 3 3
kernel.sysrq = 1
kernel.panic = 10
kernel.split_lock_mitigate = 0

# fs
fs.file-max = 2097152

# dev
dev.cdrom.autoclose = 0
dev.cdrom.autoeject = 0
dev.cdrom.check_media = 0
